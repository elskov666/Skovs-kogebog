.|Tilsæt whisky og reducér til næsten ingen væske er tilbage.|Tilsæt oksebouillon og reducér igen.|Tilsæt fløde og simr til ønsket konsistens. Smag til med salt.", "Skær bacon i strimler, steg sprød og lad dryppe af.|Kog spaghetti al dente og hæld vand fra.|Pisk æg, parmesan og fløde sammen. Vend bacon i.|Vend blandingen i den varme pasta. Varm forsigtigt under omrøring 30–60 sekunder uden at æggene bliver til røræg.|Servér med friskkværnet peber og krydderurter.", "Bland mel, rasp, salt og peber. Pisk æg separat.|Dyp flæsk i æg og panering.|Steg i smør ved middelvarme til gennemstegt og sprødt.|Bag sovs op med smør og mel. Tilsæt stegefedt og mælk gradvist under piskning. Kog igennem.|Tilsæt kulør, smag til med salt og peber. Servér med kogte kartofler og rødkål.", "Kog makaroni efter pakken.|Åbn fiskebollerne og gem al lagen.|Smelt smør og rør mel i. Tilsæt lagen gradvist under piskning og derefter mælk til ønsket konsistens.|Rør Beauvais tomatpuré i til rød-orange farve. Småkog ca. 5 minutter.|Tilsæt fiskeboller og varm forsigtigt. Smag til med salt og peber. Servér med makaroni.", "Skræl kartofler, skær i stykker og kog møre uden salt.|Skær røget snitte i tern og pølser i skiver.|Steg snitten gylden og sprød. Tilsæt pølser og steg i fedtet.|Hæld kartoffelvand fra og mos med smør og lun mælk. Smag til.|Servér med snitte, pølser og lidt stegefedt. Ingen løg. Eventuelt rødbeder.", "Brun oksekød på en pande.|Tilsæt taco-krydderi og vand og simr 5–10 minutter.|Snit salat og skær agurk og tomater.|Anret grøntsager, majs, ost, salsa og cremefraiche separat.|Varm tortillas efter pakken, fyld efter ønske og rul sammen.", "Skræl kartofler og kog møre i letsaltet vand.|Vend flæsk i mel, sammenpisket æg og rasp krydret med salt og peber.|Steg i smør ved middelvarme til gyldent og gennemstegt.|Smelt smør til sovs, rør mel i og tilsæt mælk gradvist under piskning.|Småkog ca. 5 minutter, tilsæt hakket persille og smag til. Justér eventuelt med kartoffelvand.|Servér flæsk med kartofler og persillesovs."];const LINKS=["https://www.facebook.com/share/r/1JVWCBE2bm/", "", "", "https://onekitchenblog.com/kebabgryde/", "https://onekitchenblog.com/nem-spaghettiret-opskrift/", "https://onekitchenblog.com/million-indisk-kyllingeret/", "", "https://www.dk-kogebogen.dk/opskrifter/21679/abehjerne-i-gryde", "https://www.dk-kogebogen.dk/opskrifter/30518/pebersovs", "https://www.dk-kogebogen.dk/opskrifter/23113/roedvins-sauce", "https://www.dk-kogebogen.dk/opskrifter/29100/whiskysovs-02", "https://www.dk-kogebogen.dk/opskrifter/33684/pebersauce-02", "https://www.dk-kogebogen.dk/opskrifter/7054/spaghetti-alla-cabonara", "https://www.dk-kogebogen.dk/opskrifter/28671/paneret-flaesk-fattigmands-koteletter", "", "", "", ""]; R.forEach((r,i)=>{r[4]=STEPS[i];r[5]=LINKS[i]}); R[2][3]+="|1 spsk hvidløgspulver til kylling|1 spsk hvidløgspulver til mel|3 tsk røget paprika|2.5 tsk peber|0.6 dl vand til æg|1 spsk tørret persille|1 spsk citronsaft|2 spsk olivenolie|1 spsk vand eller mælk til dressing|Salt|Olie til stegning";R[0][3]+="|Salt og peber";R[1][3]+="|Salt og peber";R[3][3]+="|Olie|Salt og peber";R[4][3]+="|Persille|Evt. chili|Salt og peber|Olie";R[6][3]+="|Salt og peber";let S;try{S=JSON.parse(localStorage.getItem('skov')||'{}')}catch{S={}};S.fav??=[];S.plan??={};S.notes??={};S.port??={};S.edits??={};S.deleted??=[];S.extra??=[];R.push(...S.extra);Object.entries(S.edits).forEach(([i,r])=>R[i]=r);let view='all';const save=()=>localStorage.setItem('skov',JSON.stringify(S));

const photoDB=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('IndexedDB understøttes ikke'));return}const req=indexedDB.open('skovs-kogebog-photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function photoPut(i,blob){const db=await photoDB;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,String(i));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function photoGet(i){const db=await photoDB;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(String(i));q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
async function photoDelete(i){const db=await photoDB;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(String(i));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function photoEntries(){const db=await photoDB;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),q=tx.objectStore('photos').getAllKeys();q.onsuccess=async()=>{try{resolve(await Promise.all(q.result.map(async key=>[key,await photoGet(key)])))}catch(e){reject(e)}};q.onerror=()=>reject(q.error)})}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(data){const [meta,payload]=data.split(',');const mime=/^data:([^;]+)/.exec(meta)?.[1]||'image/jpeg';const bin=atob(payload),bytes=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);return new Blob([bytes],{type:mime})}
async function migrateLegacyPhotos(){let moved=0;for(let i=0;i<R.length;i++){let r=R[i];if(!r||!/^data:image\/(jpeg|png|webp);base64,/i.test(r[6]||''))continue;try{await photoPut(i,dataURLToBlob(r[6]));r[6]='';if(i>=STEPS.length){S.extra[i-STEPS.length]=r}else{S.edits[i]=r}moved++}catch(e){console.warn('Billedoverførsel fejlede for',i,e)}}if(moved){try{save()}catch(e){console.warn('Kunne ikke frigøre browserlager',e)}render()}return moved}
function hydratePhotos(){document.querySelectorAll('#out article[data-recipe]').forEach(async card=>{const i=+card.dataset.recipe,img=card.querySelector('.realphoto');try{const blob=await photoGet(i);if(!blob||!card.isConnected)return;const url=URL.createObjectURL(blob);let photo=img;if(!photo){photo=document.createElement('img');photo.className='cover realphoto';photo.alt=R[i]?.[0]||'Madbillede';photo.loading='lazy';card.querySelector('.coverwrap')?.append(photo)}photo.src=url;photo.onload=()=>URL.revokeObjectURL(url);photo.onerror=()=>URL.revokeObjectURL(url)}catch(e){console.warn('Kunne ikke læse madbillede',e)}})}

function edit(i,draft){let r=draft||R[i]||['',4,'','','','',''];let e=document.getElementById('editor');e.innerHTML=`<article><h2>${i<0?'Ny opskrift':'Redigér opskrift'}</h2><form id="ef"><label>Navn<input name="title" required value="${esc(r[0])}"></label><label>Personer<input name="n" type="number" min="1" max="30" required value="${r[1]}"></label><label>Kategori (skriv din egen)<input name="cat" required value="${esc(r[2])}"></label><label>Ingredienser, én pr. linje<textarea name="ing" rows="8" required>${esc(r[3].replaceAll('|','\n'))}</textarea></label><label>Fremgangsmåde, ét trin pr. linje<textarea name="steps" rows="12" required>${esc(r[4].replaceAll('|','\n'))}</textarea></label><label>Kildelink<input name="url" type="url" value="${esc(r[5]||'')}"></label><label>Billedlink (valgfrit)<input name="imageurl" type="url" value="${esc(/^https?:/.test(r[6]||'')?r[6]:'')}"></label><label>Madbillede<input name="photo" type="file" accept="image/*"></label><button>Gem opskrift</button><button type="button" onclick="document.getElementById('editor').innerHTML=''">Annullér</button></form></article>`;e.scrollIntoView();document.getElementById('ef').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),title=f.get('title').trim(),url=f.get('url').trim();if(R.some((x,j)=>j!==i&&!S.deleted.includes(j)&&(x[0].toLowerCase()===title.toLowerCase()||(url&&x[5]===url)))){alert('Opskriften findes allerede');return}let photo=f.get('imageurl').trim()||(/^(https?:|data:image)/.test(r[6]||'')?r[6]:'');let newBlob=null;const selected=f.get('photo');if(selected&&selected.size){try{let b=await createImageBitmap(selected);let cv=document.createElement('canvas'),k=Math.min(1,800/Math.max(b.width,b.height));cv.width=Math.max(1,Math.round(b.width*k));cv.height=Math.max(1,Math.round(b.height*k));cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);newBlob=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.72));if(b.close)b.close();if(!newBlob)throw Error('Billedet kunne ikke komprimeres');photo=''}catch(err){alert('Billedet kunne ikke åbnes: '+err.message);return}}let nr=[title,+f.get('n'),f.get('cat').trim(),f.get('ing').trim().replace(/\n+/g,'|'),f.get('steps').trim().replace(/\n+/g,'|'),url,photo];let oldExtra=S.extra.slice(),oldEdit=i>=0?S.edits[i]:undefined,oldR=i>=0?R[i]:undefined;let idx=i<0?R.length:i;try{if(newBlob)await photoPut(idx,newBlob)}catch(err){alert('Billedet kunne ikke gemmes i billedlageret: '+err.message);return}if(i<0){R.push(nr);S.extra.push(nr)}else{R[i]=nr;S.edits[i]=nr}try{save()}catch(err){if(i<0){R.pop();S.extra=oldExtra}else{R[i]=oldR;if(oldEdit===undefined)delete S.edits[i];else S.edits[i]=oldEdit}if(newBlob)await photoDelete(idx).catch(()=>{});alert('Browserens opskriftslager er fyldt. Den tidligere opskrift er bevaret. Tag en backup.');return}e.innerHTML='';view='all';render()}}

function fromRecipe(x,url){let title=clean(x.name||x.title),ing=(x.recipeIngredient||x.ingredients||[]),instructions=steps(x.recipeInstructions||x.instructions||[]);if(typeof ing==='string')ing=ing.split(/\n/);if(!title||!Array.isArray(ing)||!ing.length||!instructions.length)throw Error('Ingen komplet opskrift fundet');let n=parseInt([x.recipeYield||x.servings||4].flat()[0])||4;return [title,Math.min(30,Math.max(1,n)),clean([x.recipeCategory||x.category||'Importeret'].flat()[0]),ing.map(clean).join('|'),instructions.join('|'),url,imgUrl(x.image,url)]}

async function importJSON(){let panel=document.getElementById("importstatus");try{let raw=document.getElementById('importjson').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let x=JSON.parse(raw),u=document.getElementById('importurl').value.trim()||x.url||'';let r=fromRecipe(recipeNode(x)||x,u);if(!r[6]&&/^https:\/\//.test(u)&&document.getElementById('proxy').checked){status('Leder efter rettens billede …');try{let d=await getPage(u,true);r[6]=imgUrl(extract(d)?.image||d.querySelector('meta[property="og:image"]')?.content,u)}catch{}}if(panel?.isConnected)edit(-1,r)}catch(e){status(e.message||'Ugyldige opskriftsdata')}}
async function copyPrompt(){let t='Klargør min opskrift til Skovs Kogebog som én JSON-opskrift. Brug dansk og danske måleenheder. Bevar alle ingredienser og udførlige nummerløse trin med tider og temperaturer. Felter: name, servings (tal), category, ingredients (liste af tekst), instructions (liste af tekst), image (verificeret offentligt HTTPS-billedlink til retten, ellers tom streng), url (oprindeligt kildelink, ellers tom streng). Opfind ikke billedlinks. Returnér JSON i en kodeblok, som jeg kan kopiere.';try{await navigator.clipboard.writeText(t);status('Vejledning kopieret. Indsæt den i ChatGPT sammen med din opskrift.')}catch{status(t)}}
async function fillPhotos(){let p=document.getElementById('proxy').checked;S.covers??={};let count=0;for(let i=0;i<R.length;i++){let r=R[i];if(S.deleted.includes(i)||r[6]||S.covers[i]||!/^https:\/\//.test(r[5]||'')||/facebook\.com/.test(r[5]))continue;status('Henter billede: '+r[0]);try{let d=await getPage(r[5],p),x=extract(d),u=imgUrl(x?.image||d.querySelector('meta[property="og:image"]')?.content,r[5]);if(u){S.covers[i]=u;save();count++;let card=document.querySelector(`#out article[data-recipe="${i}"] .coverwrap`);if(card)card.outerHTML=cover(R[i],i)}}catch{}}status(count+' billedlinks fundet. Øvrige fotos kan tilføjes manuelt.')}


// Hold screen awake only while a recipe is open.
let wakeHandle=null,wakePending=false;
const recipeOpen=()=>!!document.querySelector('#out article[data-recipe] details[open]');
async function syncWake(){
 const wanted=recipeOpen()&&document.visibilityState==='visible';
 if(!wanted){if(wakeHandle){const old=wakeHandle;wakeHandle=null;try{await old.release()}catch{}}return;}
 if(!navigator.wakeLock||wakeHandle||wakePending)return;
 wakePending=true;
 try{const lock=await navigator.wakeLock.request('screen');
 if(!recipeOpen()||document.visibilityState!=='visible'){await lock.release();return;}
 wakeHandle=lock;lock.addEventListener('release',()=>{if(wakeHandle===lock)wakeHandle=null;});
 }catch{}finally{wakePending=false;}
}
document.addEventListener('toggle',e=>{if(e.target.matches?.('#out article[data-recipe] details'))syncWake();},true);
document.addEventListener('visibilitychange',syncWake);
window.addEventListener('pageshow',syncWake);
new MutationObserver(()=>syncWake()).observe(document.getElementById('out'),{childList:true,subtree:true});
