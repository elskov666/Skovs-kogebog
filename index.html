const R=[
['Cremet pasta med hvidløg, smør og chili',3,'Pasta', '200 g pasta|6 fed hvidløg|50 g smør|1 spsk tomatpuré|2 dl fløde|60 g parmesan|2 dl pastavand|1 tsk italiensk krydderi|1 tsk chili|1 tsk persille','Kog pasta. Svits hvidløg i smør, tilsæt tomatpuré og krydderier. Tilsæt fløde, parmesan og pastavand. Vend pastaen i.'],
['Flæskesteg i airfryer',4,'Svinekød','1.5 kg flæskesteg|3 dl vand|3 stk laurbærblade|10 stk peberkorn','Rids svær og gnid salt imellem. Steg ved 180 °C ca. 45 min. Kontroller kernetemperatur og giv højere varme til sprøde svær. Kamsteg 65 °C, ribbensteg 70–75 °C.'],
['Sprød kyllingewrap med spicy Caesar',4,'Kylling','450 g kylling|120 g mel|2 spsk majsstivelse|2 stk æg|100 g panko|2.4 dl mayonnaise|1 tsk Worcestershire|1 fed hvidløg|2 tsk chilipasta|1 tsk dijon|25 g parmesan|4 stk tortillas|5 dl salat','Krydr kylling med paprika, hvidløg, salt og peber. Paner i mel, æg og panko. Steg til 74 °C. Bland dressing af mayonnaise, Worcestershire, hvidløg, chili, dijon og parmesan. Fyld wraps med salat, dressing og kylling.'],
['Cremet kebabgryde',4,'Gryderetter','1 stk løg|1 stk peberfrugt|4 fed hvidløg|400 g kebab|140 g tomatpuré|2 tsk spidskommen|1 tsk koriander|0.5 tsk chili|2 spsk mel|2.5 dl vand|2.5 dl fløde','Steg grøntsager og kebab i olie. Steg tomatpuré, mel og krydderier med. Tilsæt vand og fløde gradvist. Simr og smag til. Server med ris eller fritter. Frysevenlig.'],
['Cremet spaghetti med bacon og tomat',3,'Pasta','250 g spaghetti|1 stk rødløg|150 g bacon|2 spsk tomatpuré|2 dl fløde|0.75 dl pastavand|1 tsk oregano|30 g parmesan','Kog spaghetti. Steg bacon og løg. Tilsæt tomatpuré, fløde, pastavand og oregano. Vend pastaen i og top med parmesan.'],
['Million indisk kyllingeret',4,'Kylling','60 g mandler|2 cm ingefær|2 fed hvidløg|1 stk løg|1 spsk garam masala|1 tsk paprika|1 tsk spidskommen|1 tsk gurkemeje|0.5 tsk cayenne|30 g smør|450 g hakket kylling|200 g tomatpuré|1.5 dl yoghurt|2 dl fløde|2 dl vand','Blend mandler. Rist krydderier. Brun kylling og løg i smør. Tilsæt tomatpuré, mandler, ingefær og hvidløg. Rør yoghurt, fløde og vand i. Simr til gennemtilberedt. Server med ris.'],
['Cajun steak Alfredo',4,'Pasta','450 g oksekød|340 g fettuccine|4.75 dl fløde|100 g parmesan|1 spsk Cajun-krydderi|30 g smør|1 spsk olie|2 fed hvidløg|1 stk løg|4 spsk persille','Kog pasta. Krydr og brun kødet. Tag det af panden. Svits løg og hvidløg i smør. Tilsæt fløde, parmesan og Cajun. Vend pasta og kød i.'],

const STEPS=["Kog pastaen efter pakken, og gem kogevand.|Smelt smør ved middel-lav varme. Svits hakket hvidløg 1–2 minutter uden bruning.|Tilsæt tomatpuré, italiensk krydderi, chili og persille; steg 30 sekunder.|Tilsæt fløde og lad simre 2–3 minutter.|Rør parmesan og pastavand i lidt ad gangen. Smag til med salt og peber.|Vend pastaen i og servér med ekstra parmesan og chili.", "Kontrollér at sværen er ridset uden at skære i kødet.|Hæld kogende vand over sværen, tør den og gnid salt mellem rillerne. Krydr undersiden.|Kom vand, laurbær og peberkorn i en egnet beholder. Placér stegen med vandret svær opad.|Steg ved 180 °C i 45 minutter og kontrollér derefter kernetemperatur og svær. Fyld vand på ved behov.|Hæv eventuelt til 190–200 °C til sprøde svær. Kamsteg 65 °C, ribbensteg 70–75 °C.|Lad hvile utildækket 10–15 minutter. Gem sky til sovs.", "Skær kyllingebryst på langs og bank det fladt. Krydr med salt, 1 spsk hvidløgspulver, 1 tsk røget paprika og 1 tsk peber.|Bland mel og majsstivelse med samme krydderier. Pisk æg med 0,6 dl vand. Bland panko med 1 spsk tørret persille.|Vend kyllingen i mel, æg og panko. Steg i olie ved ca. 185 °C 4–5 minutter til 74 °C i centrum. Skær i strimler.|Bland mayonnaise, Worcestershire, revet hvidløg, chilipasta, Dijon, parmesan, 1 tsk røget paprika, ½ tsk peber, 1 spsk citronsaft, salt og 1–2 spsk olivenolie. Justér med 1–3 spsk vand eller mælk.|Vend halvdelen af dressingen i salaten, fordel resten på tortillas. Fyld med salat og kylling, rul og varm kort.", "Skær peberfrugt i tern og hak løg og hvidløg.|Steg grøntsager og kebab i lidt olie; kebab kan bruges fra frost.|Når kødet er stegt, tilsættes tomatpuré og steges kort. Tilsæt mel, spidskommen, koriander og chili og steg med.|Rør vand og fløde i lidt ad gangen. Lad saucen småsimre.|Smag til med salt og peber. Servér med fritter, ovnkartofler, ris eller pasta og salat. Retten er frysevenlig.", "Kog spaghetti og gem pastavand.|Hak rødløg og skær bacon i små stykker. Svits begge på en pande med lidt olie.|Tilsæt tomatpuré og steg et minut.|Tilsæt fløde, pastavand, oregano og eventuelt chili. Lad simre og smag til.|Vend pastaen i sovsen og top med parmesan og persille.", "Blend mandler fint. Riv ingefær og hvidløg, hak løg.|Rist tørre krydderier forsigtigt uden at brænde dem.|Tilsæt smør, løg, kyllingefars og salt. Brun kødet.|Tilsæt tomatpuré, mandler, ingefær og hvidløg og steg kort.|Rør yoghurt, fløde og vand i. Simr til kyllingen er gennemtilberedt og smag til.|Servér med ris, naan, raita og persille.", "Kog fettuccine efter pakken og hæld vandet fra.|Skær kødet i strimler og krydr med salt, peber og halvdelen af Cajun-krydderiet.|Steg i olivenolie ved middelhøj varme 4–5 minutter til brunet og passende tilberedt. Tag kødet af.|Svits hakket løg og hvidløg i smør på samme pande 2–3 minutter.|Tilsæt fløde og bring til simren. Rør parmesan og resten af krydderiet i.|Vend pasta og kød i sovsen og servér med frisk persille.", "Kog spaghetti efter pakken.|Steg bacon og læg til side. Hak løg og steg i baconfedtet.|Tilsæt oksekød og brun grundigt.|Tilsæt bacon, tomater og flødeost. Rør og lad simre.|Tilsæt cocktailpølser de sidste minutter og smag til med salt og peber. Servér med spaghetti eller ris.", "Hak skalotteløg, pres hvidløg og skær champignon i skiver.|Svits løg, hvidløg og svampe.|Tilsæt peberkorn, knus gerne halvdelen.|Tilsæt whisky, vand og begge bouilloner. Reducér væsken.|Tilsæt fløde og simr til ønsket konsistens. Smag til med paprika, salt og peber.", "Hak løget og svits i lidt fedtstof.|Tilsæt timian, tomatpuré og halvdelen af bouillon, vand og vin.|Kog kraftigt ca. 2 minutter.|Si løg og timian fra. Hæld væsken tilbage i gryden.|Tilsæt resten af vand, vin og bouillon. Kog op, smag til og jævn efter behov.", "Varm smør eller Kærgården og tomatpuré til kogepunktet.|Tilsæt rosmarin, whisky, fløde og sukker.|Lad simre under omrøring til ønsket konsistens.|Smag til med salt og peber.", "Dræn peberkornene, varm dem i gryden og knus groft.|Tilsæt whisky og reducér til næsten ingen væske er tilbage.|Tilsæt oksebouillon og reducér igen.|Tilsæt fløde og simr til ønsket konsistens. Smag til med salt.", "Skær bacon i strimler, steg sprød og lad dryppe af.|Kog spaghetti al dente og hæld vand fra.|Pisk æg, parmesan og fløde sammen. Vend bacon i.|Vend blandingen i den varme pasta. Varm forsigtigt under omrøring 30–60 sekunder uden at æggene bliver til røræg.|Servér med friskkværnet peber og krydderurter.", "Bland mel, rasp, salt og peber. Pisk æg separat.|Dyp flæsk i æg og panering.|Steg i smør ved middelvarme til gennemstegt og sprødt.|Bag sovs op med smør og mel. Tilsæt stegefedt og mælk gradvist under piskning. Kog igennem.|Tilsæt kulør, smag til med salt og peber. Servér med kogte kartofler og rødkål.", "Kog makaroni efter pakken.|Åbn fiskebollerne og gem al lagen.|Smelt smør og rør mel i. Tilsæt lagen gradvist under piskning og derefter mælk til ønsket konsistens.|Rør Beauvais tomatpuré i til rød-orange farve. Småkog ca. 5 minutter.|Tilsæt fiskeboller og varm forsigtigt. Smag til med salt og peber. Servér med makaroni.", "Skræl kartofler, skær i stykker og kog møre uden salt.|Skær røget snitte i tern og pølser i skiver.|Steg snitten gylden og sprød. Tilsæt pølser og steg i fedtet.|Hæld kartoffelvand fra og mos med smør og lun mælk. Smag til.|Servér med snitte, pølser og lidt stegefedt. Ingen løg. Eventuelt rødbeder.", "Brun oksekød på en pande.|Tilsæt taco-krydderi og vand og simr 5–10 minutter.|Snit salat og skær agurk og tomater.|Anret grøntsager, majs, ost, salsa og cremefraiche separat.|Varm tortillas efter pakken, fyld efter ønske og rul sammen.", "Skræl kartofler og kog møre i letsaltet vand.|Vend flæsk i mel, sammenpisket æg og rasp krydret med salt og peber.|Steg i smør ved middelvarme til gyldent og gennemstegt.|Smelt smør til sovs, rør mel i og tilsæt mælk gradvist under piskning.|Småkog ca. 5 minutter, tilsæt hakket persille og smag til. Justér eventuelt med kartoffelvand.|Servér flæsk med kartofler og persillesovs."];const LINKS=["https://www.facebook.com/share/r/1JVWCBE2bm/", "", "", "https://onekitchenblog.com/kebabgryde/", "https://onekitchenblog.com/nem-spaghettiret-opskrift/", "https://onekitchenblog.com/million-indisk-kyllingeret/", "", "https://www.dk-kogebogen.dk/opskrifter/21679/abehjerne-i-gryde", "https://www.dk-kogebogen.dk/opskrifter/30518/pebersovs", "https://www.dk-kogebogen.dk/opskrifter/23113/roedvins-sauce", "https://www.dk-kogebogen.dk/opskrifter/29100/whiskysovs-02", "https://www.dk-kogebogen.dk/opskrifter/33684/pebersauce-02", "https://www.dk-kogebogen.dk/opskrifter/7054/spaghetti-alla-cabonara", "https://www.dk-kogebogen.dk/opskrifter/28671/paneret-flaesk-fattigmands-koteletter", "", "", "", ""]; R.forEach((r,i)=>{r[4]=STEPS[i];r[5]=LINKS[i]}); R[2][3]+="|1 spsk hvidløgspulver til kylling|1 spsk hvidløgspulver til mel|3 tsk røget paprika|2.5 tsk peber|0.6 dl vand til æg|1 spsk tørret persille|1 spsk citronsaft|2 spsk olivenolie|1 spsk vand eller mælk til dressing|Salt|Olie til stegning";R[0][3]+="|Salt og peber";R[1][3]+="|Salt og peber";R[3][3]+="|Olie|Salt og peber";R[4][3]+="|Persille|Evt. chili|Salt og peber|Olie";R[6][3]+="|Salt og peber";let S;try{S=JSON.parse(localStorage.getItem('skov')||'{}')}catch{S={}};S.fav??=[];S.plan??={};S.notes??={};S.port??={};S.edits??={};S.deleted??=[];S.extra??=[];R.push(...S.extra);Object.entries(S.edits).forEach(([i,r])=>R[i]=r);let view='all';const save=()=>localStorage.setItem('skov',JSON.stringify(S));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ingredients(i,n){return R[i][3].split('|').map(s=>s.replace(/^([\d.]+)/,x=>+(x*n/R[i][1]).toFixed(2)))}function render(){let o=document.getElementById('out');let q=document.getElementById('q').value.toLowerCase();o.innerHTML='';let c=document.getElementById('cat'),cv=c.value;c.innerHTML='<option value="">Alle kategorier</option>'+[...new Set(R.filter((r,i)=>!S.deleted.includes(i)).map(r=>r[2]))].map(x=>`<option>${esc(x)}</option>`).join('');c.value=cv;if(view==='plan'||view==='shop'){let days=Object.keys(S.plan).sort();if(view==='plan'){o.innerHTML='<h2>Madplan</h2>'+days.map(d=>`<article>${esc(d)} — ${esc(R[S.plan[d].i][0])} (${S.plan[d].n} pers.) <button onclick="delete S.plan['${d}'];save();render()">Fjern</button></article>`).join('')}else{o.innerHTML='<h2>Indkøbsliste fra madplan</h2>'+days.map(d=>`<article><b>${esc(R[S.plan[d].i][0])}</b>`+ingredients(S.plan[d].i,S.plan[d].n).map(x=>`<label><input type="checkbox">${esc(x)}</label>`).join('')+'</article>').join('')}return}R.forEach((r,i)=>{if(S.deleted.includes(i)||(c.value&&r[2]!==c.value))return;if(!(r[0]+' '+r[2]).toLowerCase().includes(q)||view==='fav'&&!S.fav.includes(i))return;let n=S.port[i]||r[1];let a=document.createElement('article');a.innerHTML=`<small>${esc(r[2])}</small><h2>${esc(r[0])}</h2><button onclick="S.fav.includes(${i})?S.fav=S.fav.filter(x=>x!==${i}):S.fav.push(${i});save();render()">${S.fav.includes(i)?'♥':'♡'} Favorit</button><details><summary>Åbn opskrift</summary><label>Personer <input type="number" min="1" max="30" value="${n}" onchange="S.port[${i}]=Math.max(1,Math.min(30,+this.value||1));save();this.closest('details').querySelector('.ings').innerHTML=ingredients(${i},S.port[${i}]).map(x=>'<label><input type=checkbox>'+esc(x)+'</label>').join('')"></label><div class="ings">${ingredients(i,n).map(x=>`<label><input type="checkbox">${esc(x)}</label>`).join('')}</div>${r[6]?`<img src="${esc(r[6])}" style="width:100%;border-radius:10px">`:''}<h3>Fremgangsmåde</h3><ol>${r[4].split('|').map(t=>`<li style="margin-bottom:12px">${esc(t)}</li>`).join('')}</ol>${r[5]&&/^https?:\/\//.test(r[5])?`<a href="${esc(r[5])}" target="_blank" rel="noopener">Original opskrift</a>`:''}<p><button onclick="edit(${i})">Redigér</button><button onclick="removeRecipe(${i})">Slet</button></p><textarea placeholder="Egne noter" onchange="S.notes[${i}]=this.value;save()">${esc(S.notes[i]||'')}</textarea><label>Dato til madplan <input type="date"></label><button onclick="let d=this.previousElementSibling.querySelector('input').value;if(d){S.plan[d]={i:${i},n:S.port[${i}]||${r[1]}};save();alert('Tilføjet til madplan')}else alert('Vælg dato')">Tilføj til madplan</button></details>`;o.append(a)})}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='skovs-backup.json';a.click()}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.fav)||!x.plan||!x.notes||!x.port)throw 0;S=x;save();location.reload()}catch{alert('Ugyldig backup')}}function removeRecipe(i){if(!confirm('Slet opskriften?'))return;S.deleted.push(i);S.fav=S.fav.filter(x=>x!==i);for(let d in S.plan)if(S.plan[d].i===i)delete S.plan[d];save();render()}
function edit(i){let r=R[i]||['',4,'','','','',''];let e=document.getElementById('editor');e.innerHTML=`<article><h2>${i<0?'Ny opskrift':'Redigér opskrift'}</h2><form id="ef"><label>Navn<input name="title" required value="${esc(r[0])}"></label><label>Personer<input name="n" type="number" min="1" max="30" required value="${r[1]}"></label><label>Kategori (skriv din egen)<input name="cat" required value="${esc(r[2])}"></label><label>Ingredienser, én pr. linje<textarea name="ing" rows="8" required>${esc(r[3].replaceAll('|','\n'))}</textarea></label><label>Fremgangsmåde, ét trin pr. linje<textarea name="steps" rows="12" required>${esc(r[4].replaceAll('|','\n'))}</textarea></label><label>Kildelink<input name="url" type="url" value="${esc(r[5]||'')}"></label><label>Madbillede<input name="photo" type="file" accept="image/*"></label><button>Gem opskrift</button><button type="button" onclick="document.getElementById('editor').innerHTML=''">Annullér</button></form></article>`;e.scrollIntoView();document.getElementById('ef').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),title=f.get('title').trim(),url=f.get('url').trim();if(R.some((x,j)=>j!==i&&!S.deleted.includes(j)&&(x[0].toLowerCase()===title.toLowerCase()||(url&&x[5]===url)))){alert('Opskriften findes allerede');return}let photo=r[6]||'';if(f.get('photo').size){try{let b=await createImageBitmap(f.get('photo'));let cv=document.createElement('canvas'),k=Math.min(1,800/Math.max(b.width,b.height));cv.width=b.width*k;cv.height=b.height*k;cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);photo=cv.toDataURL('image/jpeg',.72)}catch{alert('Billedet kunne ikke åbnes');return}}let nr=[title,+f.get('n'),f.get('cat').trim(),f.get('ing').trim().replace(/\n+/g,'|'),f.get('steps').trim().replace(/\n+/g,'|'),url,photo];if(i<0){R.push(nr);S.extra.push(nr)}else{R[i]=nr;S.edits[i]=nr}try{save()}catch{alert('Lageret er fyldt. Brug et mindre billede.');return}e.innerHTML='';view='all';render()}}
render();</script></html>
