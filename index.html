<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#244638"><title>Skov’s Kogebog</title><style>body{margin:0;background:#f5f2e9;color:#243e32;font:16px system-ui}header{background:#244638;color:white;padding:25px}main{max-width:760px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bbb;border-radius:9px;margin:4px;max-width:95%}button{background:#244638;color:white}article{background:white;padding:16px;margin:12px 0;border-radius:14px}h2{margin:4px 0}label{display:block;padding:5px}small{color:#65766b}nav{display:flex;flex-wrap:wrap}textarea{width:90%}</style><header><h1>Skov’s Kogebog</h1>Familiens opskrifter</header><main><nav><button onclick="view='all';render()">Opskrifter</button><button onclick="view='fav';render()">Favoritter</button><button onclick="view='plan';render()">Madplan</button><button onclick="view='shop';render()">Indkøb</button></nav><input id="q" placeholder="Søg opskrift" oninput="render()"><div id="out"></div><button onclick="backup()">Hent backup</button><input type="file" accept="application/json" onchange="restore(this)"></main><script>
const R=[
['Cremet pasta med hvidløg, smør og chili',3,'Pasta', '200 g pasta|6 fed hvidløg|50 g smør|1 spsk tomatpuré|2 dl fløde|60 g parmesan|2 dl pastavand|1 tsk italiensk krydderi|1 tsk chili|1 tsk persille','Kog pasta. Svits hvidløg i smør, tilsæt tomatpuré og krydderier. Tilsæt fløde, parmesan og pastavand. Vend pastaen i.'],
['Flæskesteg i airfryer',4,'Svinekød','1.5 kg flæskesteg|3 dl vand|3 stk laurbærblade|10 stk peberkorn','Rids svær og gnid salt imellem. Steg ved 180 °C ca. 45 min. Kontroller kernetemperatur og giv højere varme til sprøde svær. Kamsteg 65 °C, ribbensteg 70–75 °C.'],
['Sprød kyllingewrap med spicy Caesar',4,'Kylling','450 g kylling|120 g mel|2 spsk majsstivelse|2 stk æg|100 g panko|2.4 dl mayonnaise|1 tsk Worcestershire|1 fed hvidløg|2 tsk chilipasta|1 tsk dijon|25 g parmesan|4 stk tortillas|5 dl salat','Krydr kylling med paprika, hvidløg, salt og peber. Paner i mel, æg og panko. Steg til 74 °C. Bland dressing af mayonnaise, Worcestershire, hvidløg, chili, dijon og parmesan. Fyld wraps med salat, dressing og kylling.'],
['Cremet kebabgryde',4,'Gryderetter','1 stk løg|1 stk peberfrugt|4 fed hvidløg|400 g kebab|140 g tomatpuré|2 tsk spidskommen|1 tsk koriander|0.5 tsk chili|2 spsk mel|2.5 dl vand|2.5 dl fløde','Steg grøntsager og kebab i olie. Steg tomatpuré, mel og krydderier med. Tilsæt vand og fløde gradvist. Simr og smag til. Server med ris eller fritter. Frysevenlig.'],
['Cremet spaghetti med bacon og tomat',3,'Pasta','250 g spaghetti|1 stk rødløg|150 g bacon|2 spsk tomatpuré|2 dl fløde|0.75 dl pastavand|1 tsk oregano|30 g parmesan','Kog spaghetti. Steg bacon og løg. Tilsæt tomatpuré, fløde, pastavand og oregano. Vend pastaen i og top med parmesan.'],
['Million indisk kyllingeret',4,'Kylling','60 g mandler|2 cm ingefær|2 fed hvidløg|1 stk løg|1 spsk garam masala|1 tsk paprika|1 tsk spidskommen|1 tsk gurkemeje|0.5 tsk cayenne|30 g smør|450 g hakket kylling|200 g tomatpuré|1.5 dl yoghurt|2 dl fløde|2 dl vand','Blend mandler. Rist krydderier. Brun kylling og løg i smør. Tilsæt tomatpuré, mandler, ingefær og hvidløg. Rør yoghurt, fløde og vand i. Simr til gennemtilberedt. Server med ris.'],
['Cajun steak Alfredo',4,'Pasta','450 g oksekød|340 g fettuccine|4.75 dl fløde|100 g parmesan|1 spsk Cajun-krydderi|30 g smør|1 spsk olie|2 fed hvidløg|1 stk løg|4 spsk persille','Kog pasta. Krydr og brun kødet. Tag det af panden. Svits løg og hvidløg i smør. Tilsæt fløde, parmesan og Cajun. Vend pasta og kød i.'],
['Abehjerne i gryde',4,'Gryderetter','500 g hakket oksekød|150 g bacon|115 g cocktailpølser|200 g løg|400 g hakkede tomater|100 g flødeost|400 g spaghetti','Steg bacon, løg og oksekød. Tilsæt tomater og flødeost. Simr og tilsæt pølser. Server med spaghetti.'],
['Pebersovs med champignon',4,'Sovs','50 g Madagaskar-peber|6 stk skalotteløg|1 fed hvidløg|250 g champignon|3 spsk oksebouillon|2 spsk svampebouillon|1 dl whisky|2 dl vand|5 dl fløde','Svits løg og svampe. Tilsæt peber, whisky, vand og bouillon. Reducer, tilsæt fløde og simr.'],
['Rødvinssauce',4,'Sovs','1.5 tsk timian|1.5 tsk tomatpuré|1 stk løg|2 stk bouillonterninger|2 dl rødvin|2 dl vand','Svits løg. Tilsæt timian, puré og halvdelen af vin, vand og bouillon. Kog, si og tilsæt resten. Jævn efter behov.'],
['Whiskysovs',4,'Sovs','70 g tomatpuré|100 g smør|2 tsk rosmarin|2 spsk whisky|2.5 dl fløde|1 spsk sukker','Varm smør og puré. Tilsæt resten og simr. Smag til.'],
['Madagaskar-pebersauce med whisky',4,'Sovs','0.5 dåse Madagaskar-peber|2 dl whisky|5 dl oksebouillon|2.5 dl fløde','Knus peber groft. Tilsæt whisky og reducer. Tilsæt bouillon og reducer igen. Tilsæt fløde og simr.'],
['Carbonara med fløde',4,'Pasta','300 g bacon|500 g spaghetti|4 stk pasteuriserede æg|50 g parmesan|3 dl fløde','Steg bacon sprød. Kog pasta. Pisk æg, parmesan og fløde sammen. Vend i varm pasta med bacon og varm forsigtigt.'],
['Paneret flæsk med brun sovs',4,'Svinekød','600 g flæsk|5 spsk mel|5 spsk rasp|3 stk æg|200 g smør|3 spsk mel til sovs|1 kg kartofler','Paner flæsk i æg og rasp/mel. Steg gennem. Lav opbagt sovs med smør, mel, mælk og stegefedt, tilsæt kulør. Server med kartofler og rødkål.'],
['Makaroni og fiskeboller',4,'Fisk','2 dåser fiskeboller|400 g makaroni|40 g smør|3 spsk mel|70 g Beauvais tomatpuré|3 dl mælk','Kog makaroni. Bag sovs op med smør og mel, brug lagen fra fiskebollerne og mælk. Tilsæt tomatpuré til rød-orange farve. Varm fiskebollerne i sovsen.'],
['Brændende kærlighed',4,'Familiens egne','1 kg kartofler|50 g smør|2 dl mælk|300 g røget snitte|300 g pølser','Lav kartoffelmos. Steg tern af røget snitte sprøde, tilsæt pølser i skiver. Server oven på mosen. Ingen løg.'],
['Mexicanske pandekager',4,'Wraps','8 stk tortillas|500 g hakket oksekød|1 brev tacokrydderi|1 dl vand|1 stk salat|1 stk agurk|3 stk tomater|1 dåse majs|150 g ost|2 dl cremefraiche|1 glas salsa','Brun kød, tilsæt krydderi og vand. Snit grøntsager. Varm tortillas og fyld efter ønske.'],
['Paneret flæsk med persillesovs',4,'Svinekød','800 g flæsk|2 stk æg|100 g rasp|50 g mel|40 g smør|3 spsk mel til sovs|5 dl mælk|1 bundt persille|1 kg kartofler','Kog kartofler. Paner flæsk i mel, æg og rasp og steg gennem. Bag sovs op med smør, mel og mælk. Simr og tilsæt persille.']];
let S;try{S=JSON.parse(localStorage.getItem('skov')||'{}')}catch{S={}};S.fav??=[];S.plan??={};S.notes??={};S.port??={};let view='all';const save=()=>localStorage.setItem('skov',JSON.stringify(S));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ingredients(i,n){return R[i][3].split('|').map(s=>s.replace(/^([\d.]+)/,x=>+(x*n/R[i][1]).toFixed(2)))}function render(){let o=document.getElementById('out');let q=document.getElementById('q').value.toLowerCase();o.innerHTML='';if(view==='plan'||view==='shop'){let days=Object.keys(S.plan).sort();if(view==='plan'){o.innerHTML='<h2>Madplan</h2>'+days.map(d=>`<article>${esc(d)} — ${esc(R[S.plan[d].i][0])} (${S.plan[d].n} pers.) <button onclick="delete S.plan['${d}'];save();render()">Fjern</button></article>`).join('')}else{o.innerHTML='<h2>Indkøbsliste fra madplan</h2>'+days.map(d=>`<article><b>${esc(R[S.plan[d].i][0])}</b>`+ingredients(S.plan[d].i,S.plan[d].n).map(x=>`<label><input type="checkbox">${esc(x)}</label>`).join('')+'</article>').join('')}return}R.forEach((r,i)=>{if(!(r[0]+' '+r[2]).toLowerCase().includes(q)||view==='fav'&&!S.fav.includes(i))return;let n=S.port[i]||r[1];let a=document.createElement('article');a.innerHTML=`<small>${esc(r[2])}</small><h2>${esc(r[0])}</h2><button onclick="S.fav.includes(${i})?S.fav=S.fav.filter(x=>x!==${i}):S.fav.push(${i});save();render()">${S.fav.includes(i)?'♥':'♡'} Favorit</button><details><summary>Åbn opskrift</summary><label>Personer <input type="number" min="1" max="30" value="${n}" onchange="S.port[${i}]=Math.max(1,Math.min(30,+this.value||1));save();this.closest('details').querySelector('.ings').innerHTML=ingredients(${i},S.port[${i}]).map(x=>'<label><input type=checkbox>'+esc(x)+'</label>').join('')"></label><div class="ings">${ingredients(i,n).map(x=>`<label><input type="checkbox">${esc(x)}</label>`).join('')}</div><p>${esc(r[4])}</p><textarea placeholder="Egne noter" onchange="S.notes[${i}]=this.value;save()">${esc(S.notes[i]||'')}</textarea><label>Dato til madplan <input type="date"></label><button onclick="let d=this.previousElementSibling.querySelector('input').value;if(d){S.plan[d]={i:${i},n:S.port[${i}]||${r[1]}};save();alert('Tilføjet til madplan')}else alert('Vælg dato')">Tilføj til madplan</button></details>`;o.append(a)})}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='skovs-backup.json';a.click()}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.fav)||!x.plan||!x.notes||!x.port)throw 0;S=x;save();render()}catch{alert('Ugyldig backup')}}render();</script></html>
